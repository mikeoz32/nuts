[project]
name = "nuts"
dynamic= ["version"]
description = "Nats microservices framework"
authors = [
  { name = "Mike Oz", email = "kozloffsky@hotmail.com"}
]
readme = "README.md"
requires-python=">=3.10"
dependencies = [
  "nats-py",
  "rich"
]

[tool.hatch.version]
path = "nuts/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
pachages = ["nuts"]


[tool.hatch.envs.default.scripts]
server = "python example/service.py"

[tool.hatch.envs.default]
dev-mode = true
skip-install = false 
